name: Bug report
description: Report a reproducible defect in Agent Root Runner.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include passwords, access tokens, private keys, or sensitive system data.
        For a suspected security vulnerability, do not publish exploit details in a public issue.
  - type: input
    id: version
    attributes:
      label: Version and installation method
      placeholder: "1.1.0, native release archive / source build"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: "Fedora 43, x86_64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command with secrets and private paths redacted.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Redact tokens, personal data, and sensitive command arguments before posting.
      render: text
    validations:
      required: false
