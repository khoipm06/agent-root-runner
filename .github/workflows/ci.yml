name: CI & Native Release Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native and behavioral tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run native unit and integration tests
        run: cargo test --locked --all-targets

  build-release:
    name: Build single native executable (Linux x86_64)
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build release executable
        run: cargo build --locked --release
      - name: Verify ELF and subcommands
        run: |
          file target/release/agent-root-runner | grep -q ELF
          target/release/agent-root-runner --help
          target/release/agent-root-runner daemon --help
          target/release/agent-root-runner exec --help
          target/release/agent-root-runner mcp --help
          ! ldd target/release/agent-root-runner | grep -i python
      - name: Smoke-test release executable
        run: cargo test --locked --release --test release_runtime
      - name: Package release executable and Plasma applet
        run: |
          mkdir -p dist
          install -m 0755 target/release/agent-root-runner dist/agent-root-runner
          tar -czf dist/agent-root-runner-linux-x86_64.tar.gz -C dist agent-root-runner
          (cd plasma-applet && zip -qr ../dist/agent-root-runner-plasma-applet.zip metadata.json contents)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-root-runner-linux-x86_64
          path: |
            dist/agent-root-runner
            dist/agent-root-runner-linux-x86_64.tar.gz
            dist/agent-root-runner-plasma-applet.zip

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-root-runner-linux-x86_64
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/agent-root-runner-linux-x86_64.tar.gz
            dist/agent-root-runner-plasma-applet.zip
            dist/agent-root-runner
