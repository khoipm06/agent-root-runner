[package]
name = "agent-root-runner"
version = "1.2.0"
edition = "2024"
description = "Native privileged command runner with human-in-the-loop arming and OS safety guardrails"
license = "MIT"

[[bin]]
name = "agent-root-runner"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
regex = "1.11"
serde_json = "1"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
